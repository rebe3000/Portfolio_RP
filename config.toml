baseURL = "https://rebeccapabst.vercel.app/"
languageCode = "en"
title = "Rebecca Pabst"
author = "Rebecca Pabst"
theme = "hugo-apero"
cleanDestinationDir = true
enableRobotsTXT = true
copyright = ""
metaDataFormat = "yaml"
footnoteReturnLinkContents = "&#8617;"
preserveTaxonomyNames = true
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
enableEmoji = true

[pagination]
  pagerSize = 5

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true
    hardwraps = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    style = "github"

[params]
  orgName = "Rebecca Pabst"
  orgLocal = "Lisbon, Portugal"
  description = "Rebecca Pabst — researcher in spatial ecology, invasive mosquito vectors, and disease risk at IHMT NOVA, Lisbon."
  sharing_image = "/img/landing-profile.png"
  mainSections = ["research"]
  navallcaps = true
  socialInHeader = false
  socialInFooter = true
  theme = "forest"
  custom_theme = ""
  customtextFontFamily = "Commissioner"
  customheadingFontFamily = "Fraunces"
  textFontFamily = "sans-serif"
  headingFontFamily = "sans-serif"

  [params.math]
    renderer = "katex"

